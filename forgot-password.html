<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MediConnect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                120deg,
                rgba(5, 35, 65, 0.88),
                rgba(0, 115, 135, 0.72)
            ), url('images/medical-bg.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            color: #172033;
        }

        .auth-navbar {
            width: 100%;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 25px;
            font-weight: 800;
            color: white;
            text-decoration: none;
        }

        .brand span {
            color: #48e0d0;
        }

        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-home:hover {
            color: #48e0d0;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px 55px;
        }

        .forgot-card {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.97);
            padding: 42px 38px;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .icon-circle {
            width: 66px;
            height: 66px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #e4f8f6;
            color: #078f91;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 27px;
        }

        .forgot-card h1 {
            font-size: 27px;
            text-align: center;
            color: #102c46;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            font-size: 14px;
            line-height: 1.8;
            color: #687586;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: #263b50;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d8e1e9;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #078f91;
            box-shadow: 0 0 0 3px rgba(7, 143, 145, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #078f91;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #067678;
            transform: translateY(-1px);
        }

        .back-login {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #687586;
        }

        .back-login a {
            color: #078f91;
            text-decoration: none;
            font-weight: 700;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .auth-footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 12px;
            padding: 18px;
        }

        @media (max-width: 480px) {
            .auth-navbar {
                padding: 20px 6%;
            }

            .brand {
                font-size: 22px;
            }

            .forgot-card {
                padding: 32px 23px;
            }

            .forgot-card h1 {
                font-size: 24px;
            }
        }
    </style>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <nav class="auth-navbar">
        <a href="index.html" class="brand">
            Medi<span>Connect</span>
        </a>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Home
        </a>
    </nav>

    <main class="auth-wrapper">
        <section class="forgot-card">

            <div class="icon-circle">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>Forgot Password?</h1>

            <p class="description">
                Don't worry! Enter your registered email address
                below to begin the password recovery process.
            </p>

            <form id="forgotForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn">
                    Continue <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <p class="back-login">
                Remember your password?
                <a href="login.php">Sign In</a>
            </p>

        </section>
    </main>

    <footer class="auth-footer">
        &copy; 2026 MediConnect. All rights reserved.
    </footer>

    <script>
        document.getElementById("forgotForm").addEventListener("submit", function(event) {
            event.preventDefault();

            alert(
                "The password recovery feature will be available after PHP and MySQL backend integration."
            );
        });
    </script>

</body>
</html>
